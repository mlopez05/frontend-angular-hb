<div class="notificaciones fade-in">
  <div class="page-header">
    <div>
      <h2>Notificaciones</h2>
      <p>{{ noLeidas() }} notificaciones sin leer</p>
    </div>
  </div>
  <div *ngIf="loading" class="spinner"></div>
  <div *ngIf="error" class="alert alert-error">{{ error }}</div>
  <div *ngIf="!loading && notificaciones.length === 0" class="empty-state">
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
    </svg>
    <h3>Sin notificaciones</h3>
    <p>Aquí aparecerán tus notificaciones</p>
  </div>
  <div class="notif-list">
    <div *ngFor="let n of notificaciones" [class]="'notif-card ' + (n.leida ? 'leida' : 'no-leida')">
      <div class="notif-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
      </div>
      <div class="notif-body">
        <p class="notif-mensaje">{{ n.mensaje || n.contenido }}</p>
        <span class="notif-fecha">{{ n.fechaCreacion | date:'dd/MM/yyyy HH:mm' }}</span>
      </div>
      <div class="notif-action">
        <button *ngIf="!n.leida" class="btn btn-outline btn-sm" (click)="marcarLeida(n.id || n.idNotificacion)">
          ✓ Marcar leída
        </button>
        <span *ngIf="n.leida" class="badge badge-completada">Leída</span>
      </div>
    </div>
  </div>
</div>
